name: Aiven Keep Alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Ejecutar consulta Keep-Alive
        run: |
                    mysql -h "://aivencloud.com" -P 24029 -u "avnadmin" -p"AVNS_2abzGchYtmErU0E7gNu" "defaultdb" -e "SELECT 1;"

